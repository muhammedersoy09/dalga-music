<title>Dalga Music</title>
<style>
:root{--bg:#0D0F13;--sf:#181B22;--ink:#F1F3F6;--mute:#9099A8;--line:#262A33;--ac:#2BD46A;--acink:#06140B;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 150px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}.brand b{font-size:1.6rem;letter-spacing:-.02em}
.mute{color:var(--mute);font-size:.9rem}
.btn{background:var(--ac);color:var(--acink);font-weight:700;padding:14px 26px;border-radius:999px;margin:14px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.chip{flex:none;padding:10px 16px;border:1px solid var(--line);background:var(--sf);border-radius:999px}
input{width:100%;font:inherit;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px;cursor:pointer}
.row img,.row .ph{width:52px;height:52px;border-radius:8px;flex:none;background:var(--line)}
.meta{flex:1;min-width:0}.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msg{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--sf);display:none}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px)}
.np{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:8px}
.np img,.np .ph{width:44px;height:44px;border-radius:8px;flex:none;background:var(--line)}
.np button{width:44px;height:44px;font-size:1.2rem;border-radius:50%}
.np .pp{background:var(--ink);color:var(--bg)}
</style>
</head>
